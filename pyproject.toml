[project]
name = "indexscout"
version = "0.2.0"
description = "Agent-first, read-only Google Search Console MCP server for evidence-backed search investigations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Pow" }]
keywords = ["mcp", "google-search-console", "seo", "agents", "codex", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer; pin the major version.
    "mcp>=2.2,<3",
    "google-api-python-client>=2.160",
    "google-auth>=2.38",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "keyring>=25",
    "filelock>=3.16",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/jpow18/indexscout"
Issues = "https://github.com/jpow18/indexscout/issues"

[project.scripts]
indexscout = "indexscout.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexscout"]

[tool.hatch.build.targets.sdist]
include = ["src/indexscout", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "E501"]  # the formatter owns line length; long strings stay readable

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google_auth_httplib2", "httplib2", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
